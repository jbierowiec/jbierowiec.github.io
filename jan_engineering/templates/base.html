<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title or "Engineering Portfolio" }}</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/styles.css') }}"
    />

    <!-- Smooth scroll behavior -->
    <style>
      html {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body class="bg-gray-1 text-gray-9">
    <!-- Sticky Navbar -->
    <nav
      id="navbar"
      class="navbar navbar-expand-lg fixed-top gray-nav border-bottom border-gray-4"
    >
      <div class="container-fluid">
        <a class="navbar-brand fw-semibold text-gray-10" href="#hero"
          >Jan Bierowiec</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navlinks"
          aria-controls="navlinks"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div id="navlinks" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="#hero">3D Car</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#projects">Projects</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#skills">Skills</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#current">Current CAD</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#contact">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Scanner overlay + rotating gears background -->
    <div class="scanner-overlay pointer-events-none"></div>
    <!-- Background gears (replace your current .gears-bg inner SVGs) -->
    <div class="gears-bg pointer-events-none">
      <svg class="gear gear-lg" viewBox="0 0 100 100" aria-hidden="true">
        <path
          d="M59.5 6.5 63 16a34 34 0 0 1 6.9 4.1l10.4-3.4 5.6 9.7-8.7 7a34 34 0 0 1 1.2 7.9l9.2 5-2.8 10.8-10.5-.2a34 34 0 0 1-5.7 6.9l3.4 10.4-9.7 5.6-7-8.7a34 34 0 0 1-7.9 1.2l-5 9.2L32 79.9l.2-10.5a34 34 0 0 1-6.9-5.7l-10.4 3.4-5.6-9.7 8.7-7a34 34 0 0 1-1.2-7.9l-9.2-5L8.6 27l10.5.2a34 34 0 0 1 5.7-6.9L21.4 9.9l9.7-5.6 7 8.7a34 34 0 0 1 7.9-1.2l5-9.2ZM50 36a14 14 0 1 0 0 28 14 14 0 0 0 0-28Z"
        />
      </svg>
      <svg class="gear gear-sm" viewBox="0 0 100 100" aria-hidden="true">
        <path
          d="M59.5 8.5 62.5 16a26 26 0 0 1 5.4 3.2l7.9-2.6 4.2 7.1-6.6 5.3a26 26 0 0 1 .9 6l7 3.8-2.1 8.1-8.1-.2a26 26 0 0 1-4.3 5.3l2.6 7.9-7.1 4.2-5.3-6.6a26 26 0 0 1-6 .9l-3.8 7-8.1-2.1.2-8.1a26 26 0 0 1-5.3-4.3l-7.9 2.6-4.2-7.1 6.6-5.3a26 26 0 0 1-.9-6l-7-3.8 2.1-8.1 8.1.2a26 26 0 0 1 4.3-5.3L33.8 14l7.1-4.2 5.3 6.6a26 26 0 0 1 6-.9l3.8-7ZM50 38a12 12 0 1 0 0 24 12 12 0 0 0 0-24Z"
        />
      </svg>
    </div>

    <!-- Content -->
    {% block content %}{% endblock %}

    <!-- Sticky Footer -->
    <!-- Modern Engineering Footer -->
    <footer class="footer fixed-bottom gray-footer border-top border-gray-4">
      <div
        class="container-fluid py-2 px-4 d-flex flex-wrap align-items-center justify-content-between"
      >
        <div class="d-flex align-items-center gap-2">
          <svg class="footer-gear" viewBox="0 0 100 100" aria-hidden="true">
            <path
              d="M50 30a20 20 0 1 0 0 40a20 20 0 1 0 0-40zm0-30 5 12a38 38 0 0 1 10 4l11-6 10 17-11 6a38 38 0 0 1 0 11l11 6-10 17-11-6a38 38 0 0 1-10 4l-5 12h-20l-5-12a38 38 0 0 1-10-4l-11 6-10-17 11-6a38 38 0 0 1 0-11l-11-6 10-17 11 6a38 38 0 0 1 10-4l5-12z"
            />
          </svg>
          <span class="text-gray-8 small"
            >© {{ 2025 }} Jan Bierowiec — Engineering Portfolio</span
          >
        </div>

        <div class="footer-links d-flex align-items-center gap-3 small">
          <a href="#projects" class="footer-link">Projects</a>
          <a href="#skills" class="footer-link">Skills</a>
          <a href="#current" class="footer-link">Current Work</a>
          <a href="#contact" class="footer-link">Contact</a>
          <a href="#hero" class="footer-link">↑ Top</a>
        </div>
      </div>
      <div class="footer-scan"></div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
